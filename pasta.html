<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("muevo-tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:image" content="https://review.muevo.com.br/assets/apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
@font-face{font-family:"BDO Grotesk";src:url(assets/BDOGrotesk-VF.woff2) format("woff2");font-weight:300 900;font-style:normal;font-display:swap}
:root{
  --bg:#E7E7E5; --surface:#F7F7F6; --sunk:#DFDFDC;
  --ink:#0B0B0B; --ink-2:#4A4A47; --ink-3:#74746D;
  --line:#D4D4D0; --line-2:#E2E2DF;
  --accent:#FF4405; --accent-2:#FF6A33; --accent-ink:#C93600;
  --good-ink:#08780a; --good-bg:#DDEFDB; --warn-ink:#875a00; --warn-bg:#F7EBCF;
  --font:"BDO Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090909; --surface:#141414; --sunk:#1F1F1F;
  --ink:#F2F2F0; --ink-2:#BDBDB9; --ink-3:#8A8A86;
  --line:#272727; --line-2:#1D1D1D; --accent-ink:#FF6A33;
  --good-ink:#5fd35f; --good-bg:#16301a; --warn-ink:#fab219; --warn-bg:#33290f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#090909; --surface:#141414; --sunk:#1F1F1F;
  --ink:#F2F2F0; --ink-2:#BDBDB9; --ink-3:#8A8A86;
  --line:#272727; --line-2:#1D1D1D; --accent-ink:#FF6A33;
  --good-ink:#5fd35f; --good-bg:#16301a; --warn-ink:#fab219; --warn-bg:#33290f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.5;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
.wrap{max-width:1360px;margin:0 auto;padding-block:24px 40px;display:flex;flex-direction:column;gap:28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brandh{display:flex;align-items:baseline;gap:.32em;font-weight:400;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.025em;line-height:1}
.brandh img{height:.729em;width:auto;display:block;flex:none}
.brandh span{font-weight:300;color:var(--ink-3)}
.themebtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;padding:0}
.themebtn:hover{border-color:var(--ink-3);color:var(--ink)}
.themebtn .i-moon{display:none}
:root[data-tema-atual="dark"] .themebtn .i-sun{display:none}
:root[data-tema-atual="dark"] .themebtn .i-moon{display:block}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.head h2{font-size:clamp(32px,5vw,56px);font-weight:500;letter-spacing:-.03em;line-height:1.02}
.resumo{font-size:14px;color:var(--ink-3)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line-2);color:inherit;text-decoration:none;transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.10)}
.capa{position:relative;aspect-ratio:16/9;background:#0E0E0E center/cover no-repeat;display:grid;place-items:center}
.capa .play{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .15s ease}
.card:hover .capa .play{opacity:1}
.capa .tipo{position:absolute;left:10px;top:10px;height:24px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.capa .baixa{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.capa .baixa:hover{background:var(--accent)}
.capa .baixa:disabled{opacity:.6;cursor:default}
/* prévia ao passar o mouse (como no Frame.io): quadro do ponto do mouse + linha */
.capa .scrub{position:absolute;inset:0;background:#0E0E0E no-repeat;opacity:0;transition:opacity .12s ease;pointer-events:none;overflow:hidden}
.capa.rolando .scrub.pronto{opacity:1}
.capa .scrub video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0E0E0E}
.capa .scrub .sl{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.capa .scrub .sb{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.capa.rolando .play,.capa.rolando .sem{opacity:0!important}
.capa .tranca{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#BDBDBD;font-size:13px;font-weight:500}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.dlall{height:36px;padding:0 16px;border-radius:999px;border:0;background:linear-gradient(120deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.dlall svg{color:#2A2A2A}
.dlall:disabled{opacity:.7;cursor:default}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:8px}
@media (max-width:640px){.top{flex-wrap:wrap}.meta{display:contents}.meta .acoes{order:3;width:100%}}
.sharebtn{height:36px;padding:0 16px;border-radius:999px;border:1px solid #3A3A3A;background:#2A2A2A;color:#fff;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.sharebtn svg{color:var(--accent)}
.sharebtn:hover{background:#333}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;z-index:50}
.toast.show{opacity:1}
.capa .sem{position:absolute;inset:0;display:grid;place-items:center;color:#8A8A86;font-size:13px}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.nm{font-size:16px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.linha{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.aprovado{background:var(--good-bg);color:var(--good-ink)}
.st.ajustes{background:var(--warn-bg);color:var(--warn-ink)}
.st.proc::before{display:none}
.data{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.aviso{max-width:520px;margin:12vh auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.aviso h2{font-size:24px;font-weight:600}
.aviso p{margin:0;color:var(--ink-3)}
.gira{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.foot b{color:var(--ink);font-weight:700;letter-spacing:.02em}
@media (max-width:640px){.grade{grid-template-columns:1fr}}
.subsec{margin-top:34px}
.subtit{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:0 0 14px;color:var(--ink)}
.subtit::before{content:"";width:16px;height:13px;border-radius:2px 3px 3px 3px;background:var(--ink-3);opacity:.55;clip-path:polygon(0 0,40% 0,52% 18%,100% 18%,100% 100%,0 100%)}
.trava{max-width:560px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.trava h2{font-weight:400;font-size:30px;letter-spacing:-.025em}
.trava p{margin:0;font-size:15px;color:var(--ink-2)}
.senhaform{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.senhacampo{position:relative;flex:1 1 220px;display:flex}
.senhaform input{flex:1 1 220px;height:46px;padding:0 50px 0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.senhaform input:focus{outline:2px solid var(--accent);outline-offset:1px}
.senhaform .abrir{height:46px;padding:0 22px;border-radius:999px;border:0;background:linear-gradient(120deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.senhaform .abrir:disabled{opacity:.7;cursor:default}
.senhaform .olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;cursor:pointer;padding:0}
.senhaform .olho:hover{color:var(--ink);background:var(--sunk)}
.senhaform .olho.on{color:var(--accent)}
.senhaerro{color:#D9483B;font-size:14px;min-height:20px}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brandh"><img src="assets/muevo-simbolo.png" alt="Muevo"><span>Review</span></h1>
    <div class="meta">
      <div class="acoes" id="acoes" hidden>
      <button type="button" class="dlall" id="dlAll" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 19h14"/></svg><span>Baixar arquivos</span></button>
      <button type="button" class="sharebtn" id="shareBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span>Compartilhar</span></button>
      </div>
    <button type="button" class="themebtn" id="themeBtn" title="Modo claro ou escuro" aria-label="Alternar modo claro ou escuro"><svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    </div>
  </header>

  <div class="aviso" id="carregando"><div class="gira" aria-hidden="true"></div><p>Abrindo a pasta…</p></div>
  <div class="aviso" id="erro" hidden><h2>Esta pasta não está disponível</h2><p id="erroMsg">Confira o link com quem enviou para você.</p></div>

  <div class="trava" id="trava" hidden>
    <h2>Esta pasta é protegida por senha</h2>
    <p>Digite a senha que a Muevo enviou para ver os arquivos.</p>
    <form class="senhaform" id="travaForm" novalidate>
      <div class="senhacampo"><input type="password" id="travaSenha" autocomplete="off" aria-label="Senha" placeholder="Senha" maxlength="64">
        <button type="button" class="olho" id="travaOlho" title="Mostrar senha" aria-label="Mostrar senha" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <button type="submit" class="abrir" id="travaGo">Abrir</button>
    </form>
    <div class="senhaerro" id="travaErro" role="alert"></div>
  </div>

  <main id="conteudo" hidden>
    <div class="headrow">
      <div class="head">
        <div class="eyebrow" id="cliente"></div>
        <h2 id="projeto"></h2>
        <div class="resumo" id="resumo"></div>
      </div>
    </div>
    <div class="grade" id="grade"></div>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <footer class="foot"><b>MUEVO STUDIO™</b><span>Crie o movimento. Seja o movimento.</span><span>@muevo.studio · muevo.com.br</span></footer>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const API = (window.MUEVO_API || "").trim();
  // link curto: pasta.html?unity-ato-<código> (os nomes são só para ler; vale o código no fim)
  const P = new URLSearchParams(location.search).get("p") || ((q => q && !q.includes("=") ? ((decodeURIComponent(q).match(/(?:^|-)([a-f0-9]{16})$/) || [])[1] || "") : "")(location.search.slice(1).split("&")[0]));
  const slugCli = c => String(c||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,30).replace(/-+$/,"");
  const MES3 = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  // tema claro/escuro, o mesmo do resto do app
  const temaAtual = () => document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const marca = () => document.documentElement.setAttribute("data-tema-atual", temaAtual());
  marca(); try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", marca); } catch(e){}
  $("themeBtn").onclick = () => { const n = temaAtual()==="dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("muevo-tema", n); } catch(e){} marca(); };

  const GKEY = (window.MUEVO_GKEY || "").trim();
  const DL_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>';
  let ITENS = [];
  function toast(m, ms){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"), ms||2400); }
  // ---------- download dos originais (o mesmo ajudante da página do player: nome original, sem a página de aviso do Google) ----------
  const safari = /^((?!chrome|chromium|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);
  if ("serviceWorker" in navigator && window.isSecureContext && !safari) navigator.serviceWorker.register("sw.js").catch(()=>{});
  async function temAjudante(){
    if (safari || !navigator.serviceWorker || !GKEY) return false;
    try { const reg=await navigator.serviceWorker.getRegistration(); if (reg && (reg.active||reg.waiting||reg.installing)) return true; } catch(e){}
    try { const reg=await navigator.serviceWorker.register("sw.js"); await Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(r,3000))]); return !!(reg && reg.active); } catch(e){ return false; }
  }
  async function nomeDe(arq, it){
    if (arq.nome) return arq.nome;
    try { const r=await fetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(arq.id)+"?fields=name&supportsAllDrives=true&key="+encodeURIComponent(GKEY));
      if (r.ok){ const d=await r.json(); if (d.name) return d.name; } } catch(e){}
    return (it.peca || "arquivo").replace(/[\\/:*?"<>|]+/g,"_");
  }
  async function baixaArquivo(arq, it, ajudante){
    const reserva="https://drive.usercontent.google.com/download?id="+encodeURIComponent(arq.id)+"&export=download&confirm=t";
    if (ajudante){
      const nome=await nomeDe(arq, it);
      const fr=document.createElement("iframe"); fr.hidden=true;
      fr.src="__baixar?id="+encodeURIComponent(arq.id)+"&key="+encodeURIComponent(GKEY)+"&nome="+encodeURIComponent(nome)+"&reserva="+encodeURIComponent(reserva);
      document.body.appendChild(fr); setTimeout(()=>fr.remove(), 120000);
    } else {
      const a=document.createElement("a"); a.href=reserva; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    }
  }
  const espera = ms => new Promise(r=>setTimeout(r, ms));
  async function baixaItens(lista, botao){
    const arqs=[]; lista.forEach(it=>(it.arquivos||[]).forEach(a=>arqs.push([a,it])));
    if (!arqs.length){ toast("Não há arquivos para baixar aqui."); return; }
    if (botao) botao.disabled=true;
    try {
      const ajudante=await temAjudante();
      if (arqs.length>1) toast("Baixando "+arqs.length+" arquivos. Se o navegador perguntar, permita vários downloads.", 5000); else toast("Download iniciado");
      for (let i=0; i<arqs.length; i++){ await baixaArquivo(arqs[i][0], arqs[i][1], ajudante); if (i<arqs.length-1) await espera(1500); }
    } finally { if (botao) setTimeout(()=>{ botao.disabled=false; }, 1500); }
  }
  $("dlAll").onclick=()=>baixaItens(ITENS, $("dlAll"));
  // compartilhar: no celular abre o menu do sistema (WhatsApp, e-mail…); no computador copia o link
  $("shareBtn").onclick=async()=>{
    const nomeCurto=[slugCli($("cliente").textContent), slugCli(String($("projeto").textContent).split(" / ").pop())].filter(Boolean).join("-");
    const url=location.origin+location.pathname+"?"+(nomeCurto ? nomeCurto+"-" : "")+P, titulo=document.title;
    // o nome vai junto: no WhatsApp, uma mensagem só com o link esconde o endereço
    const txt=(String($("projeto").textContent).split(" / ").pop() || "") ? String($("projeto").textContent).split(" / ").pop()+"\n"+url : url;
    if (navigator.share && matchMedia("(hover: none)").matches){ try { await navigator.share({ text:txt }); return; } catch(e){ if (e && e.name==="AbortError") return; } }
    try { await navigator.clipboard.writeText(txt); toast("Link da pasta copiado"); }
    catch(e){ window.prompt("Link da pasta:", url); }
  };

  function erro(msg){ $("carregando").hidden=true; $("conteudo").hidden=true; $("erro").hidden=false; if (msg) $("erroMsg").textContent=msg; }
  function el(tag, cls, txt){ const e=document.createElement(tag); if (cls) e.className=cls; if (txt!=null) e.textContent=txt; return e; }
  function status(it){
    if (it.processando) return ["proc", "Carregando"];
    if (it.aprovado) return ["aprovado", "Aprovado"];
    if (it.abertos>0) return ["ajustes", it.abertos+(it.abertos===1 ? " ajuste aberto" : " ajustes abertos")];
    if (it.comentarios>0) return ["", "Ajustado"];
    return ["", "Aguardando feedback"];
  }
  const ROT = { video:"Vídeo", imagem:"Imagem", galeria:"Galeria", pdf:"PDF" };
  function data(iso){ const d=new Date(iso); return isNaN(d) ? "" : d.getDate()+" "+MES3[d.getMonth()]+" "+d.getFullYear(); }

  function mostra(d){
    const bonito = x => String(x||"").split("/").map(y=>y.trim()).filter(Boolean).join(" / ");
    document.title = bonito(d.projeto) + " · " + d.cliente + " | Muevo Review";
    $("cliente").textContent = d.cliente; $("projeto").textContent = bonito(d.projeto);
    const n = d.itens.length; ITENS = d.itens;
    $("dlAll").hidden = !d.itens.some(i=>i.arquivos && i.arquivos.length); $("acoes").hidden=false;
    $("resumo").textContent = n ? (n===1 ? "1 arquivo para revisão" : n+" arquivos para revisão") + ". Clique em um para assistir e comentar." : "";
    const g0=$("grade"); g0.textContent=""; g0.parentNode.querySelectorAll(".subsec").forEach(x=>x.remove());
    if (!n){ g0.appendChild(el("p","resumo","Ainda não há arquivos nesta pasta.")); }
    // arquivos das pastas de dentro (V1, V2…) aparecem embaixo, cada pasta com o seu título
    const grupos=new Map(); d.itens.forEach(it=>{ const k=String(it.sub||""); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(it); });
    const ordem=[...grupos.keys()].sort((a,b)=> !a ? -1 : !b ? 1 : a.localeCompare(b,"pt-BR",{numeric:true,sensitivity:"base"}));
    let antes=g0;
    if (!grupos.has("")) g0.hidden = !!n; else g0.hidden=false;
    ordem.forEach(k=>{ let g=g0;
      if (k){ const sec=el("section","subsec"); sec.appendChild(el("h3","subtit", bonito(k))); g=el("div","grade"); sec.appendChild(g); antes.after(sec); antes=sec; }
      grupos.get(k).forEach(it=>g.appendChild(cartao(it))); });
    $("carregando").hidden=true; $("erro").hidden=true; $("conteudo").hidden=false;
  }
  function cartao(it){
      const a=el("a","card"); a.href="index.html?j="+encodeURIComponent(it.token)+"&p="+encodeURIComponent(P);
      const c=el("div","capa");
      if (it.senha){ const tr=el("span","tranca"); tr.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'; tr.append("Protegido por senha"); c.appendChild(tr); }
      else if (it.capa){ const im=new Image(); im.onload=()=>{ c.style.backgroundImage="url('"+it.capa.replace(/'/g,"%27")+"')"; }; im.src=it.capa; }
      else c.appendChild(el("span","sem", it.processando ? "Preparando a prévia…" : "Sem prévia"));
      const tipo = it.tipo==="galeria" && it.qtd ? "Galeria · "+it.qtd : it.tipo==="pdf" && it.qtd ? "PDF · "+it.qtd+" pág." : (ROT[it.tipo] || "Vídeo");
      c.appendChild(el("span","tipo",tipo));
      if (it.arquivos && it.arquivos.length){
        const bx=el("button","baixa"); bx.type="button"; bx.innerHTML=DL_SVG;
        bx.title = it.arquivos.length>1 ? "Baixar as "+it.arquivos.length+" imagens originais" : "Baixar o arquivo original"; bx.setAttribute("aria-label", bx.title+" de "+(it.peca||"arquivo"));
        bx.onclick=e=>{ e.preventDefault(); e.stopPropagation(); baixaItens([it], bx); };
        c.appendChild(bx);
      }
      if (it.previa) scrub(c, it);
      const pl=el("span","play"); pl.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>'; c.appendChild(pl);
      const inf=el("div","info"); inf.appendChild(el("div","nm", it.peca || "Arquivo"));
      const [cls,txt]=status(it); const ln=el("div","linha"); ln.append(el("span","st "+cls, txt), el("span","data", data(it.criado_em)));
      inf.appendChild(ln); a.append(c, inf); return a;
  }
  // prévia ao passar o mouse: usa a folha de quadros do vídeo; se o vídeo for antigo e não tiver, usa a versão leve
  const QUAD = 20, TEM_MOUSE = matchMedia("(hover: hover) and (pointer: fine)").matches;
  function scrub(c, it){
    if (!TEM_MOUSE) return;
    const lay = el("div","scrub"), linha = el("i","sl"), barra = el("i","sb"); lay.append(linha, barra); c.insertBefore(lay, c.firstChild);
    const folha = it.previa.replace(/\.mp4$/i, "-quadros.jpg");
    let modo = null, img = null, vid = null, alvo = null, f = 0;
    const pinta = () => {
      linha.style.left = (f*100) + "%"; barra.style.width = (f*100) + "%";
      if (modo === "folha"){
        const W = c.clientWidth, H = c.clientHeight, fw = img.naturalWidth / QUAD, fh = img.naturalHeight;
        const k = Math.min(W / fw, H / fh), i = Math.min(QUAD - 1, Math.floor(f * QUAD));
        lay.style.backgroundSize = (img.naturalWidth * k) + "px " + (fh * k) + "px";
        lay.style.backgroundPosition = ((W - fw * k) / 2 - i * fw * k) + "px " + ((H - fh * k) / 2) + "px";
      } else if (modo === "video" && vid){
        const t = f * (vid.duration || it.duracao || 0);
        if (vid.seeking) alvo = t; else if (t > 0) vid.currentTime = t;
      }
    };
    const usaVideo = () => { modo = "video"; vid = document.createElement("video"); vid.muted = true; vid.playsInline = true; vid.preload = "auto"; vid.src = it.previa;
      vid.addEventListener("seeked", () => { if (alvo !== null){ const t = alvo; alvo = null; vid.currentTime = t; } });
      vid.addEventListener("loadeddata", () => { lay.classList.add("pronto"); pinta(); }); lay.insertBefore(vid, linha); };
    c.addEventListener("mouseenter", () => {
      c.classList.add("rolando");
      if (!img){ img = new Image();
        img.onload = () => { modo = "folha"; lay.style.backgroundImage = "url('" + folha.replace(/'/g, "%27") + "')"; lay.classList.add("pronto"); pinta(); };
        img.onerror = usaVideo; img.src = folha; }
    });
    c.addEventListener("mouseleave", () => { c.classList.remove("rolando"); });
    c.addEventListener("mousemove", e => { const r = c.getBoundingClientRect(); f = Math.min(0.999, Math.max(0, (e.clientX - r.left) / r.width)); pinta(); });
  }
  async function carrega(){
    if (!/^[a-f0-9]{16}$/.test(P) || !API) return erro();
    try {
      const r = await fetch(API + "?pasta=" + encodeURIComponent(P) + (CHAVE ? "&chave=" + encodeURIComponent(CHAVE) : "") + "&_=" + Date.now());
      const d = await r.json();
      if (!d.ok && d.erro === "senha") return pedeSenha();
      if (!d.ok) return erro();
      // arquivos que usam a senha da pasta: guarda a chave de cada um, para abrirem sem pedir a senha de novo
      d.itens.forEach(i=>{ if (i.chave) try { sessionStorage.setItem("muevo-chave-"+i.token, i.chave); } catch(e){} });
      mostra(d);
      // enquanto algum arquivo estiver carregando, atualiza sozinho
      if (d.itens.some(i=>i.processando)) setTimeout(carrega, 15000);
    } catch(e){ if ($("conteudo").hidden) erro("Não consegui abrir agora. Confira sua internet e tente de novo."); }
  }
  const K_CHAVE = "muevo-pchave-" + P;
  let CHAVE = ""; try { CHAVE = sessionStorage.getItem(K_CHAVE) || ""; } catch(e){}
  function pedeSenha(){
    try { sessionStorage.removeItem(K_CHAVE); } catch(e){} CHAVE = "";
    $("carregando").hidden = true; $("trava").hidden = false; setTimeout(()=>$("travaSenha").focus(), 30);
  }
  $("travaOlho").onclick = () => { const i = $("travaSenha"), ver = i.type === "password"; i.type = ver ? "text" : "password";
    const b = $("travaOlho"), t = ver ? "Esconder senha" : "Mostrar senha"; b.title = t; b.setAttribute("aria-label", t); b.setAttribute("aria-pressed", String(ver)); b.classList.toggle("on", ver); i.focus(); };
  $("travaForm").onsubmit = async ev => { ev.preventDefault();
    const senha = $("travaSenha").value.trim(), er = $("travaErro"), bt = $("travaGo");
    if (!senha){ er.textContent = "Digite a senha."; $("travaSenha").focus(); return; }
    bt.disabled = true; bt.textContent = "Conferindo…"; er.textContent = "";
    try {
      const r = await fetch(API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({ acao:"senha_pasta", pasta:P, senha }) });
      const d = await r.json();
      if (d.ok){ CHAVE = d.chave || ""; try { sessionStorage.setItem(K_CHAVE, CHAVE); } catch(e){}
        $("trava").hidden = true; $("carregando").hidden = false; bt.disabled = false; bt.textContent = "Abrir"; carrega(); return; }
      er.textContent = d.erro === "senha_errada" ? "Senha incorreta. Confira e tente de novo."
        : d.erro === "muitas_tentativas" ? "Muitas tentativas erradas. Espere 15 minutos e tente de novo." : "Não foi possível conferir agora. Tente de novo.";
      $("travaSenha").select();
    } catch(e){ er.textContent = "Sem conexão. Tente de novo."; }
    bt.disabled = false; bt.textContent = "Abrir"; };
  carrega();
})();
</script>
